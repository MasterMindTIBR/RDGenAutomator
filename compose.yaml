services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rdgen_automator
      POSTGRES_USER: rdgen
      POSTGRES_PASSWORD: rdgen
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdgen -d rdgen_automator"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
volumes:
  postgres-data:
  redis-data:
